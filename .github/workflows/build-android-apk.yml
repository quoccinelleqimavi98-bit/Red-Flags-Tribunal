name: Build Android APK

# Construit un APK Android via EAS Build :
#   - à chaque push (toute branche) : l'APK est déposé comme artifact du
#     run, dans l'onglet Actions → (le run) → Artifacts (téléchargement
#     ZIP, conservé ~30 jours, pas de Release créée).
#   - à chaque push d'un tag de version "v*" (ex: v1.0.0) : l'APK est en
#     plus publié comme pièce jointe d'une Release GitHub permanente.
#   - déclenchable manuellement depuis l'onglet Actions (workflow_dispatch).
# Nécessite un secret de dépôt EXPO_TOKEN (voir le README, section
# "Configurer les builds Android automatiques").
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Compute build metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Android APK on EAS
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build-output.json

      - name: Download the built APK from EAS
        run: |
          BUILD_URL=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('eas-build-output.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            const url = build && build.artifacts && build.artifacts.buildUrl;
            if (!url) {
              console.error('No artifacts.buildUrl in eas build output:', JSON.stringify(build));
              process.exit(1);
            }
            console.log(url);
          ")
          echo "Downloading APK from $BUILD_URL"
          curl -fL "$BUILD_URL" -o soiree-games.apk
          ls -la soiree-games.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: soiree-games-apk-${{ steps.meta.outputs.sha_short }}
          path: soiree-games.apk

      - name: Prepare versioned APK for the release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp soiree-games.apk "soiree-games-${{ github.ref_name }}.apk"

      - name: Publish APK as a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Soirée Games ${{ github.ref_name }}"
          body: |
            APK généré automatiquement par EAS Build à partir du commit
            ${{ github.sha }}.
          files: soiree-games-${{ github.ref_name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
